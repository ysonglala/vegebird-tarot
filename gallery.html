  <style>
    :root{
      --bg:#090814;--card:#141126;--line:rgba(255,255,255,.08);--text:#f6f2ff;--muted:rgba(246,242,255,.68);--gold:#f0cd7a;
    }
    *{box-sizing:border-box}
    body{margin:0;font-family:"Noto Serif SC","PingFang SC","Microsoft YaHei",serif;background:radial-gradient(circle at top, #1b1638, #090814 55%);color:var(--text)}
    .wrap{max-width:1280px;margin:0 auto;padding:24px}
    .hero{display:flex;justify-content:space-between;gap:16px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
    .heroActions{display:flex;gap:10px;align-items:center;justify-content:flex-end;flex-wrap:wrap}
    h1{margin:0;font-size:28px}
    .sub{color:var(--muted);margin-top:8px;line-height:1.7;max-width:880px}
    .meta{padding:10px 14px;border:1px solid rgba(240,205,122,.10);border-radius:14px;background:linear-gradient(180deg, rgba(20,17,38,.92), rgba(14,12,28,.92));color:var(--muted);box-shadow:0 10px 30px rgba(0,0,0,.18)}
    .toolbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:18px 0 22px}
    .langMenu{position:relative;flex:0 0 auto;z-index:50}
    .langMenu__panel[hidden]{display:none !important}
    .langMenu__panel{position:absolute;top:calc(100% + 8px);right:0;min-width:156px;padding:10px;border-radius:18px;border:1px solid #5d4b28;background:#141126;box-shadow:0 18px 40px rgba(0,0,0,.52);display:grid;gap:8px;z-index:80;transform-origin:top right;animation:langMenuIn 120ms ease-out}
    .langMenu__item{position:relative;width:100%;min-height:48px;text-align:left;border:1px solid #3b3455;background:#1b1638;color:var(--text);border-radius:13px;padding:13px 42px 13px 15px;font:inherit;font-size:14px;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;transition:background 120ms ease,border-color 120ms ease,box-shadow 120ms ease}
    .langMenu__item:hover{background:#241d46;border-color:#6c5730}
    .langMenu__item.is-active{background:#2b2145;border-color:#8b713c;color:rgba(255,239,181,.98);box-shadow:0 0 0 1px rgba(240,205,122,.12), inset 0 0 18px rgba(240,205,122,.05)}
    .langMenu__item.is-active::after{content:"✓";position:absolute;right:12px;top:50%;transform:translateY(-50%);color:rgba(255,239,181,.98);font-size:13px;font-weight:700}
    .ghostBtn{cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;transition:transform 160ms ease,background 160ms ease,border-color 160ms ease,box-shadow 160ms ease;border:1px solid rgba(240,205,122,.16);box-shadow:0 10px 30px rgba(0,0,0,.18);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
    .ghostBtn:hover{background:#1b1648;border-color:#7a6336}
    .ghostBtn--icon{width:42px;height:42px;padding:0}
    .ghostIcon{width:18px;height:18px;display:block;pointer-events:none}
    .ghostBtn--lang{color:rgba(246,242,255,.96);gap:8px;padding:0 16px;min-width:88px;min-height:52px;height:52px;border-radius:999px;background:#15113a;border:1px solid #5d4b28;box-shadow:0 10px 30px rgba(0,0,0,.35)}
    .ghostBtn--lang:hover{background:#1b1648;border-color:#7a6336}
    .ghostBtn__langCode{display:inline-flex;align-items:center;justify-content:center;min-width:20px;font-size:13px;line-height:1;letter-spacing:.08em;color:rgba(255,239,181,.96);font-weight:700;pointer-events:none}
    .ghostBtn__caret{display:inline-flex;align-items:center;justify-content:center;font-size:12px;color:rgba(246,242,255,.78);transition:transform 120ms ease,color 120ms ease;pointer-events:none}
    .langMenu.is-open .ghostBtn__caret{transform:rotate(180deg);color:rgba(255,239,181,.96)}
    @keyframes langMenuIn{from{opacity:0;transform:translateY(-6px) scale(.96)}to{opacity:1;transform:translateY(0) scale(1)}}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
    .item{background:rgba(20,17,38,.92);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.28);cursor:pointer}
    .item:hover{transform:translateY(-2px);transition:transform .16s ease}
    .thumb{aspect-ratio:3/4.5;background:#0f0c1f;display:block;width:100%;object-fit:cover}
    .body{padding:12px}
    .title{font-weight:700}
    .subtitle{font-size:12px;color:var(--gold);margin-top:5px}
    .summary{font-size:12px;color:var(--muted);margin-top:8px;line-height:1.65;min-height:3.3em}
    .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
    .tag{display:inline-block;padding:4px 8px;border-radius:999px;border:1px solid rgba(240,205,122,.25);color:var(--gold);font-size:12px}
    .modal::backdrop{background:rgba(0,0,0,.72);backdrop-filter:blur(6px)}
    .modal{border:0;padding:0;background:transparent;max-width:980px;width:calc(100% - 24px);color:var(--text)}
    .modalCard{border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,.12);background:linear-gradient(180deg, rgba(21,17,58,.95), rgba(13,11,34,.96));box-shadow:0 24px 70px rgba(0,0,0,.45)}
    .modalHead{display:flex;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.10)}
    .modalTitle{font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
    .modalSub{font-size:12px;color:var(--muted);margin-top:4px}
    .closeBtn{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.04);color:var(--text);width:36px;height:36px;border-radius:12px;cursor:pointer}
    .modalBody{display:grid;grid-template-columns:minmax(260px,320px) minmax(0,1fr);gap:18px;padding:18px}
    .posterWrap{border-radius:18px;overflow:hidden;border:1px solid rgba(240,205,122,.14);background:#0f0c1f}
    .poster{display:block;width:100%;height:auto}
    .posterNote{font-size:12px;color:var(--muted);text-align:center;margin-top:10px}
    .section{margin-bottom:14px}
    .sectionK{font-size:12px;color:var(--muted);letter-spacing:.08em;margin-bottom:8px}
    .sectionV{line-height:1.8}
    .panelGrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
    .panel{border-radius:16px;padding:14px;background:rgba(255,255,255,.03);border:1px solid rgba(240,205,122,.12)}
    .panelTitle{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
    @media (max-width:760px){.modalBody{grid-template-columns:1fr}.panelGrid{grid-template-columns:1fr}}
    @media (max-width:480px){
      .wrap{padding:14px}.hero{margin-bottom:16px;align-items:flex-start}h1{font-size:24px}.sub{font-size:13px;line-height:1.6}
      .heroActions{width:100%;justify-content:space-between;align-items:center;gap:8px}.langMenu{margin-left:auto}.langMenu__panel{right:0;min-width:148px}
      .toolbar{gap:10px;margin:14px 0 18px}.input,.select{width:100%;padding:11px 12px;font-size:14px}
      .grid{grid-template-columns:1fr;gap:12px}.item{border-radius:16px}.body{padding:10px 10px 12px}
      .title{font-size:16px;line-height:1.35}.summary{font-size:11px;line-height:1.55;min-height:auto;margin-top:6px}
      .chips{gap:6px;margin-top:8px}.tag{padding:3px 7px;font-size:11px}.meta{width:100%;font-size:12px;order:3}
    }
  </style>

<body>

  <script>

    const $ = s => document.querySelector(s);
    const $$ = s => Array.from(document.querySelectorAll(s));

    const I18N = {
      zh: {
        htmlLang: 'zh-CN',
        title: 'Vegebird Tarot · 本地牌图库',
        heroTitle: 'Vegebird Tarot 图库',
        heroSub: '可按大阿卡纳 / 权杖 / 圣杯 / 宝剑 / 星币分组浏览，也可直接搜索中英文牌名。点击任意牌可直接查看牌义。',
        backHome: '返回抽牌页',

        searchPlaceholder: '搜索：愚者 / The Fool',
        groups: [
          ['', '全部分组'],
          ['大阿卡纳', '大阿卡纳'],
          ['圣杯', '圣杯'],
          ['权杖', '权杖'],

          ['星币', '星币'],
        ],
        meta: (all, shown) => `共 ${all} 张｜当前显示 ${shown} 张`,
        modalTitle: '牌义详情',
        posterNote: '当前显示真实牌图',
        summary: '摘要',
        keywords: '关键词',
        upright: '正位',
        reversed: '逆位',
        meaning: '牌义',

        close: '关闭',
        majorArcana: '大阿卡纳',
        number: (n) => `灵数 ${n}`,
      },
      en: {
        htmlLang: 'en',
        title: 'Vegebird Tarot · Card Gallery',
        heroTitle: 'Vegebird Tarot Gallery',
        heroSub: 'Browse by Major Arcana / Wands / Cups / Swords / Pentacles, or search directly by Chinese or English card name. Tap any card to view its meanings instantly.',
        backHome: 'Back to draw page',
        loading: 'Loading…',
        searchPlaceholder: 'Search: The Fool / 愚者',
        groups: [
          ['', 'All groups'],
          ['大阿卡纳', 'Major Arcana'],
          ['圣杯', 'Cups'],
          ['权杖', 'Wands'],
          ['宝剑', 'Swords'],

        ],
        meta: (all, shown) => `${all} cards total · ${shown} shown`,
        modalTitle: 'Card details',
        posterNote: 'Showing the real card image',
        summary: 'Summary',
        keywords: 'Keywords',
        upright: 'Upright',
        reversed: 'Reversed',
        meaning: 'Meaning',
        noMeaning: 'No card meaning available.',
        noKeywords: 'No keywords yet',
        noSummary: 'No summary available',
        emptySummary: 'Tap to view the full meaning of this card.',
        close: 'Close',
        majorArcana: 'Major Arcana',
        number: (n) => `Number ${n}`,
      }
    };

    const EN_CARD_NAMES = {
      '愚者': 'The Fool', '魔术师': 'The Magician', '女祭司': 'The High Priestess', '女皇': 'The Empress', '皇帝': 'The Emperor', '教皇': 'The Hierophant', '恋人': 'The Lovers', '战车': 'The Chariot', '力量': 'Strength', '隐者': 'The Hermit',
      '命运之轮': 'Wheel of Fortune', '正义': 'Justice', '倒吊人': 'The Hanged Man', '死神': 'Death', '节制': 'Temperance', '恶魔': 'The Devil', '塔': 'The Tower', '高塔': 'The Tower', '星星': 'The Star', '月亮': 'The Moon', '太阳': 'The Sun', '审判': 'Judgement', '世界': 'The World',
    };
    const EN_SUITS = { '权杖': 'Wands', '圣杯': 'Cups', '宝剑': 'Swords', '星币': 'Pentacles', '大阿卡纳': 'Major Arcana' };
    const EN_RANKS = { '王牌': 'Ace', '二': 'Two', '三': 'Three', '四': 'Four', '五': 'Five', '六': 'Six', '七': 'Seven', '八': 'Eight', '九': 'Nine', '十': 'Ten', '侍从': 'Page', '骑士': 'Knight', '王后': 'Queen', '国王': 'King' };
    const EN_ELEMENTS = { '风': 'Air', '水': 'Water', '火': 'Fire', '土': 'Earth' };
    const CARD_ORDER = {
      '愚者': 0, '魔术师': 1, '女祭司': 2, '女皇': 3, '皇帝': 4, '教皇': 5, '恋人': 6, '战车': 7, '力量': 8, '隐者': 9,
      '命运之轮': 10, '正义': 11, '倒吊人': 12, '死神': 13, '节制': 14, '恶魔': 15, '高塔': 16, '塔': 16, '星星': 17,
      '月亮': 18, '太阳': 19, '审判': 20, '世界': 21,
      '圣杯王牌': 22, '圣杯二': 23, '圣杯三': 24, '圣杯四': 25, '圣杯五': 26, '圣杯六': 27, '圣杯七': 28, '圣杯八': 29,
      '圣杯九': 30, '圣杯十': 31, '圣杯侍从': 32, '圣杯骑士': 33, '圣杯王后': 34, '圣杯国王': 35,
      '权杖王牌': 36, '权杖二': 37, '权杖三': 38, '权杖四': 39, '权杖五': 40, '权杖六': 41, '权杖七': 42, '权杖八': 43,
      '权杖九': 44, '权杖十': 45, '权杖侍从': 46, '权杖骑士': 47, '权杖王后': 48, '权杖国王': 49,
      '星币王牌': 50, '星币二': 51, '星币三': 52, '星币四': 53, '星币五': 54, '星币六': 55, '星币七': 56, '星币八': 57,
      '星币九': 58, '星币十': 59, '星币侍从': 60, '星币骑士': 61, '星币王后': 62, '星币国王': 63,
      '宝剑王牌': 64, '宝剑二': 65, '宝剑三': 66, '宝剑四': 67, '宝剑五': 68, '宝剑六': 69, '宝剑七': 70, '宝剑八': 71,
      '宝剑九': 72, '宝剑十': 73, '宝剑侍从': 74, '宝剑骑士': 75, '宝剑王后': 76, '宝剑国王': 77
    };

    function t(key, ...args) {
      const value = I18N[state.lang][key];
      return typeof value === 'function' ? value(...args) : value;
    }

    function normalizeDictText(text = '') {
      return String(text || '').replace(/^[：:、，\s]+/, '').replace(/\s+/g, ' ').trim();
    }

    function hasCJK(text = '') {
      return /[\u3400-\u9FFF]/.test(String(text || ''));
    }

    function preferVisibleEnglish(text = '') {
      const clean = normalizeDictText(text);
      if (!clean) return '';
      if (state.lang === 'en' && hasCJK(clean)) return '';
      return clean;
    }

    function getDisplayCardName(name) {
      if (state.lang === 'zh') return name;
      if (EN_CARD_NAMES[name]) return EN_CARD_NAMES[name];
      const suit = Object.keys(EN_SUITS).find(s => s !== '大阿卡纳' && name.startsWith(s));
      if (!suit) return name;
      const rank = name.slice(suit.length);
      return `${EN_RANKS[rank] || rank} of ${EN_SUITS[suit] || suit}`;
    }

    function getDisplayGroup(group) {
      if (state.lang === 'zh') return group;
      return EN_SUITS[group] || group;
    }

    function getCardElement(card) {
      const majorElements = {
        '愚者': '风','魔术师': '水','女祭司': '水','女皇': '土','皇帝': '火','教皇': '土','恋人': '风','战车': '水','力量': '火','隐者': '土','命运之轮': '火','正义': '风','倒吊人': '水','死神': '水','节制': '火','恶魔': '土','塔': '火','高塔': '火','星星': '风','月亮': '水','太阳': '火','审判': '火','世界': '土'
      };
      const suitElements = { '权杖': '火', '圣杯': '水', '宝剑': '风', '星币': '土' };
      const raw = majorElements[card.label] || suitElements[card.group] || '';
      return state.lang === 'zh' ? raw : (EN_ELEMENTS[raw] || raw);
    }

    function getCardNumerology(card) {
      const majorNumbers = {
        '愚者': '0','魔术师': '1','女祭司': '2','女皇': '3','皇帝': '4','教皇': '5','恋人': '6','战车': '7','力量': '8','隐者': '9','命运之轮': '10','正义': '11','倒吊人': '12','死神': '13','节制': '14','恶魔': '15','塔': '16','高塔': '16','星星': '17','月亮': '18','太阳': '19','审判': '20','世界': '21'
      };
      if (card.group === '大阿卡纳') return majorNumbers[card.label] || '';
      const rankMatch = card.label.replace(card.group, '');
      const map = { '王牌': '1', '二': '2', '三': '3', '四': '4', '五': '5', '六': '6', '七': '7', '八': '8', '九': '9', '十': '10' };
      return map[rankMatch] || '';
    }

    function getCanonicalCardName(cardOrName) {
      if (!cardOrName) return '';
      if (typeof cardOrName === 'string') return cardOrName;
      return cardOrName.chineseName || cardOrName.label || cardOrName.name || '';
    }

    function getDictEntry(cardOrName) {
      const key = getCanonicalCardName(cardOrName);
      const aliases = {
        '愚者': '愚人',
        '隐者': '隐士',
        '塔': '高塔',
        '圣杯王牌': '圣杯一',
        '权杖王牌': '权杖一',
        '宝剑王牌': '宝剑一',
        '星币王牌': '星币一',
        '圣杯王后': '圣杯皇后',
        '权杖王后': '权杖皇后',
        '宝剑王后': '宝剑皇后',
        '星币王后': '星币皇后',
      };
      return state.tarotDict?.[key] || state.tarotDict?.[aliases[key]] || null;
    }
    function getCardSummary(cardOrName) {
      const dict = getDictEntry(cardOrName);
      return state.lang === 'en'
        ? (normalizeDictText(dict?.summary_en || dict?.summary) || '')
        : (normalizeDictText(dict?.summary) || '');
    }
    function getCardMeaning(cardOrName, side) {
      const dict = getDictEntry(cardOrName);
      return (state.lang === 'en'
        ? normalizeDictText(side === 'up' ? (dict?.up_en || dict?.upright_en || dict?.up || dict?.upright) : (dict?.rev_en || dict?.reversed_en || dict?.rev || dict?.reversed))
        : normalizeDictText(side === 'up' ? (dict?.upright || dict?.up || dict?.upright_text) : (dict?.reversed || dict?.rev || dict?.reversed_text))) || t('noMeaning');
    }
    function getCardMeaningKeywords(cardOrName, side) {
      const dict = getDictEntry(cardOrName);
      return (state.lang === 'en'
        ? normalizeDictText(side === 'up' ? (dict?.upright_keywords_en || dict?.upright_keywords || dict?.keywords_en?.join(', ')) : (dict?.reversed_keywords_en || dict?.reversed_keywords || dict?.keywords_en?.join(', ')))
        : normalizeDictText(side === 'up' ? (dict?.upright_keywords || dict?.up_keywords || dict?.keywords) : (dict?.reversed_keywords || dict?.rev_keywords || dict?.keywords))) || t('noKeywords');
    }
    function getCardKeywords(cardOrName) {
      const dict = getDictEntry(cardOrName);
      const raw = state.lang === 'en'
        ? normalizeDictText(dict?.upright_keywords_en || dict?.upright_keywords || dict?.keywords_en?.join(', '))
        : normalizeDictText(dict?.upright_keywords || dict?.up_keywords || dict?.keywords);
      return raw || t('noKeywords');
    }

    async function setLanguage(lang) {
      state.lang = I18N[lang] ? lang : 'zh';
      localStorage.setItem('vege_tarot_lang', state.lang);
      const dict = await loadDict();
      state.tarotDict = dict.cards || {};
      applyTranslations();
      render();
      if (state.activeCard) openModal(state.activeCard);
    }

    function toggleLanguageMenu(force) {
      const menu = $('#langMenu');
      const panel = $('#langMenuPanel');
      const btn = $('#btnLang');
      if (!menu || !panel || !btn) return;
      const next = typeof force === 'boolean' ? force : panel.hasAttribute('hidden');
      panel.toggleAttribute('hidden', !next);
      menu.classList.toggle('is-open', next);
      btn.setAttribute('aria-expanded', next ? 'true' : 'false');
    }

    function selectLanguage(lang) {
      if (!I18N[lang]) return;
      const nextLang = I18N[lang] ? lang : 'zh';
      toggleLanguageMenu(false);
      if (nextLang === state.lang) {
        applyTranslations();
        render();
        if (state.activeCard) openModal(state.activeCard);
        return;
      }
      setLanguage(nextLang);
    }

    function applyTranslations() {
      document.documentElement.lang = I18N[state.lang].htmlLang;
      document.title = t('title');
      $('#heroTitle').textContent = t('heroTitle');
      $('#heroSub').textContent = t('heroSub');
      $('#backHome').textContent = t('backHome');
      $('#meta').textContent = t('loading');
      $('#search').placeholder = t('searchPlaceholder');
      $('#modalTitle').textContent = t('modalTitle');
      $('#posterNote').textContent = t('posterNote');
      $('#labelSummary').textContent = t('summary');
      $('#labelKeywords').textContent = t('keywords');
      $('#labelUp').textContent = t('upright');
      $('#labelRev').textContent = t('reversed');
      $('#labelUpKeywords').textContent = t('keywords');
      $('#labelRevKeywords').textContent = t('keywords');
      $('#labelUpMeaning').textContent = t('meaning');
      $('#labelRevMeaning').textContent = t('meaning');
      $('#closeModal').setAttribute('aria-label', t('close'));
      const btnLang = $('#btnLang');
      const label = state.lang === 'zh' ? '选择语言 / Choose language' : 'Choose language / 选择语言';
      btnLang.setAttribute('aria-label', label);
      btnLang.setAttribute('title', label);
      const langCode = $('#langCode');
      if (langCode) langCode.textContent = state.lang === 'zh' ? '中' : 'EN';
      $$('.langMenu__item').forEach((node) => {
        const isActive = node.dataset.lang === state.lang;
        node.classList.toggle('is-active', isActive);
        node.setAttribute('aria-pressed', isActive ? 'true' : 'false');
      });
      renderGroupSelect();
    }

    function renderGroupSelect() {
      const select = $('#group');
      const current = select.value;
      select.innerHTML = '';
      t('groups').forEach(([value, label]) => {
        const option = document.createElement('option');
        option.value = value;
        option.textContent = label;
        select.appendChild(option);
      });
      select.value = current;
    }

    function openModal(card) {
      state.activeCard = card;
      $('#modalMeta').textContent = state.lang === 'zh'
        ? `${getDisplayGroup(card.group)} · ${card.englishName || getDisplayCardName(card.label)}`
        : `${getDisplayGroup(card.group)} · ${getDisplayCardName(card.label)}`;
      $('#modalName').textContent = getDisplayCardName(card.label);
      $('#modalImage').src = card.file;
      $('#modalImage').alt = getDisplayCardName(card.label);
      $('#modalSummary').textContent = getCardSummary(card) || t('noSummary');
      $('#modalKeywords').textContent = getCardKeywords(card);
      $('#modalUpKeywords').textContent = getCardMeaningKeywords(card, 'up');
      $('#modalUp').textContent = getCardMeaning(card, 'up');
      $('#modalRevKeywords').textContent = getCardMeaningKeywords(card, 'rev');
      $('#modalRev').textContent = getCardMeaning(card, 'rev');
      const chips = $('#modalChips');
      chips.innerHTML = '';
      [getDisplayGroup(card.group), getCardElement(card), getCardNumerology(card) ? t('number', getCardNumerology(card)) : ''].filter(Boolean).forEach(text => {
        const span = document.createElement('span');
        span.className = 'tag';
        span.textContent = text;
        chips.appendChild(span);
      });
      $('#cardModal').showModal();
    }

    function render() {
      const q = $('#search').value.trim().toLowerCase();
      const g = $('#group').value.trim();
      const list = state.cards.filter(card => {
        const hitQ = !q || [card.label, card.chineseName, card.englishName, getDisplayCardName(card.label), card.file, card.group, getDisplayGroup(card.group)].join(' ').toLowerCase().includes(q);
        const hitG = !g || card.group === g;
        return hitQ && hitG;
      }).sort((a, b) => {
        const ao = CARD_ORDER[a.label] ?? a.index ?? 999;
        const bo = CARD_ORDER[b.label] ?? b.index ?? 999;
        return ao - bo;
      });
      $('#meta').textContent = t('meta', state.cards.length, list.length);
      const grid = $('#grid');
      grid.innerHTML = '';
      list.forEach(card => {
        const article = document.createElement('article');
        article.className = 'item';
        const displayName = getDisplayCardName(card.label);
        article.innerHTML = `
          <img class="thumb" src="${card.file}" alt="${displayName}" loading="lazy" />
          <div class="body">
            <div class="title">${displayName}</div>
            <div class="subtitle">${state.lang === 'zh' ? (card.englishName || '') : ''}</div>
            <div class="summary">${state.lang === 'en' ? t('emptySummary') : (getCardSummary(card) || t('emptySummary'))}</div>
            <div class="chips">
              <span class="tag">${getDisplayGroup(card.group)}</span>
              ${getCardElement(card) ? `<span class="tag">${getCardElement(card)}</span>` : ''}
              ${getCardNumerology(card) ? `<span class="tag">${t('number', getCardNumerology(card))}</span>` : ''}
            </div>
          </div>`;
        article.addEventListener('click', () => openModal(card));
        grid.appendChild(article);
      });
    }

    function getDictUrl() {
      return state.lang === 'en'
        ? './assets/tarot-dict-display-en.json'
        : './assets/tarot-dict-display-normalized.json';
    }

    function loadDict() {
      return fetch(getDictUrl()).then(r => r.json()).catch(() => ({ cards: {} }));
    }

    Promise.all([
      fetch('./assets/imported-deck-manifest.json').then(r => r.json()),
      loadDict()
    ]).then(([manifest, dict]) => {
      state.cards = manifest.cards || [];
      state.tarotDict = dict.cards || {};
      applyTranslations();
      render();
    });

    $('#search').addEventListener('input', render);
    $('#group').addEventListener('change', render);
    const btnLang = $('#btnLang');
    if (btnLang) {
      let lastLangButtonPointerAt = 0;
      const handleLangButtonPress = (e) => {
        e.preventDefault();
        e.stopPropagation();
        lastLangButtonPointerAt = Date.now();
        toggleLanguageMenu();
      };
      btnLang.addEventListener('pointerdown', handleLangButtonPress);
      btnLang.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (Date.now() - lastLangButtonPointerAt > 450) toggleLanguageMenu();
      });
    }
    $$('.langMenu__item').forEach((item) => {
      let lastLangItemPointerAt = 0;
      const handleLangItemPress = (e) => {
        e.preventDefault();
        e.stopPropagation();
        lastLangItemPointerAt = Date.now();
        selectLanguage(item.dataset.lang);
      };
      item.addEventListener('pointerdown', handleLangItemPress);
      item.addEventListener('click', (e) => {
        e.preventDefault();
        e.stopPropagation();
        if (Date.now() - lastLangItemPointerAt > 450) selectLanguage(item.dataset.lang);
      });
    });
    document.addEventListener('click', (e) => {
      const menu = $('#langMenu');
      if (!menu) return;
      if (!menu.contains(e.target)) toggleLanguageMenu(false);
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') toggleLanguageMenu(false);
    });
    $('#closeModal').addEventListener('click', () => $('#cardModal').close());
    $('#cardModal').addEventListener('click', (e) => { if (e.target === $('#cardModal')) $('#cardModal').close(); });
  </script>
</body>
</html>
