  <script>
    (() => {
      const canvas = document.getElementById('stars');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      if (!ctx) return;
      const media = window.matchMedia('(prefers-reduced-motion: reduce)');
      const stars = [];
      let raf = null;

      function resize() {
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars.length = 0;
        const count = Math.max(36, Math.floor((window.innerWidth * window.innerHeight) / 24000));
        for (let i = 0; i < count; i += 1) {
          stars.push({
            x: Math.random() * window.innerWidth,
            y: Math.random() * window.innerHeight,
            r: Math.random() * 1.6 + 0.4,
            a: Math.random() * 0.7 + 0.15,
            v: Math.random() * 0.012 + 0.004,
          });
        }
      }

      function draw() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        for (const s of stars) {
          s.a += s.v;
          if (s.a > 0.95 || s.a < 0.12) s.v *= -1;
          ctx.beginPath();
          ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
          ctx.fillStyle = `rgba(255, 244, 210, ${s.a})`;
          ctx.shadowBlur = 10;
          ctx.shadowColor = 'rgba(247,208,122,.35)';
          ctx.fill();
        }
        ctx.shadowBlur = 0;
        if (!media.matches) raf = requestAnimationFrame(draw);
      }

      resize();
      draw();
      window.addEventListener('resize', resize);
      media.addEventListener?.('change', () => {
        if (raf) cancelAnimationFrame(raf);
        draw();
      });
    })();
  </script>
</body>
